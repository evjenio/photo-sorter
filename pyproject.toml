[project]
name = "photo-sorter"
version = "0.1.0"
description = "Copy a messy photo/video library into date and place based folders"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4",
    "pillow-heif>=0.18",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
photo-sorter = "photo_sorter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_sorter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
